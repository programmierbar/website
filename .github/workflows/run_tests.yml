name: Run tests

on:
  pull_request:
    paths:
      - 'directus-cms/extensions/directus-extension-programmierbar-bundle/**'
      - 'nuxt-app/**'
      # The extension bundle imports from shared-code/, so a change there can break its build or
      # tests. Without this line those changes skip the gate entirely.
      - 'shared-code/**'
      - '.github/workflows/run_tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: directus-cms/extensions/directus-extension-programmierbar-bundle
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Reads the bundle's own .nvmrc rather than naming a version here, so CI, the Docker image and
      # local development have one file to change instead of three.
      #
      # Deliberately still 22 while nuxt-app is on 24 — but *not* because of the Directus licence
      # block, which an earlier version of this comment claimed. Every @directus/* package this
      # bundle uses is MIT; only the `directus` server package is licence-blocked, and it lives in
      # directus-cms/package.json. The real reason is Dockerfile.directus: Node 24 brings npm 11,
      # which gates the install scripts this tree's native dependencies need.
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: directus-cms/extensions/directus-extension-programmierbar-bundle/.nvmrc
          cache: 'npm'
          cache-dependency-path: 'directus-cms/extensions/directus-extension-programmierbar-bundle/package-lock.json'

      # Keep `npm ci`, not `npm install`, so the lockfile stays authoritative.
      - name: Install dependencies
        run: npm ci

      # Keep `prettier:check`, not `prettier` — the latter writes, so it would pass by mutating.
      # Without this step formatting is voluntary, which is how 64 files drifted here unnoticed.
      - name: Check formatting
        run: npm run prettier:check

      # Keep `lint`, not `eslint` — the latter runs with --fix, so it mutates instead of failing.
      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm test

      # Nothing above confirms the bundle still compiles: `directus-extension build` has its own
      # Rollup/esbuild pipeline that neither ESLint nor Jest exercises, so a change that breaks the
      # actual artefact Directus loads could otherwise merge green.
      - name: Build
        run: npm run build

  nuxt-app-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nuxt-app
    steps:
      # Full history, not the default `fetch-depth: 1`: the fallow step below diffs against the PR's
      # base branch, and a depth-1 checkout has neither that branch nor a merge base to diff against.
      # The repository is ~11 MB, so fetching all of it costs less than the targeted-fetch dance.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Reads nuxt-app/.nvmrc rather than naming a version here, so CI and local development cannot
      # drift apart again — there is one file to change, not three.
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: nuxt-app/.nvmrc
          cache: 'npm'
          cache-dependency-path: 'nuxt-app/package-lock.json'

      - name: Install dependencies
        run: npm ci

      # Dead-code gate: reports unused exports, files, types and unresolved imports as annotations on
      # the PR diff. `audit --base` scores only what the PR introduces, so the existing findings do not
      # have to be fixed first and there is no baseline file to keep in sync.
      #
      # `continue-on-error` while the 26 pre-existing findings are still in the tree: a run that turns
      # the job red on day one gets switched off rather than used. Remove it once those are cleaned up
      # (tracked separately) — from then on a newly introduced dead export fails the job.
      #
      # Pinned to an exact version and run through npx rather than added to package.json: fallow is a
      # ~54 MB platform binary plus a ~27 MB type-aware sidecar, and only CI runs it, so it should not
      # land in every `npm ci` (local installs and the Vercel build included). Renovate is scoped to
      # `nuxt-app/**`, so this pin is bumped by hand.
      - name: Dead-code audit (fallow)
        continue-on-error: true
        run: npx --yes fallow@3.27.0 audit --base "origin/$GITHUB_BASE_REF" --format github-annotations

      # Keep `prettier:check`, not `prettier` — the latter writes, so it would pass by mutating.
      # Without this step formatting is voluntary, which is how 90 files drifted after the Prettier
      # 3.2 -> 3.9 bump in Phase 2 with nothing noticing.
      - name: Check formatting
        run: npm run prettier:check

      # Keep `lint`, not `eslint` — the latter runs with --fix, so it mutates instead of failing.
      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm test

      # Fails only if the error count rises above .typecheck-baseline; see the script for why.
      - name: Typecheck (ratchet)
        run: npm run typecheck:ratchet

      - name: Build
        env:
          SKIP_PRERENDER_ROUTE_DISCOVERY: 'true'
        run: npm run build
