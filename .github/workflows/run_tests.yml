name: Run tests

on:
  pull_request:
    paths:
      - 'directus-cms/extensions/directus-extension-programmierbar-bundle/**'
      - 'nuxt-app/**'
      - '.github/workflows/run_tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: directus-cms/extensions/directus-extension-programmierbar-bundle
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'directus-cms/extensions/directus-extension-programmierbar-bundle/package-lock.json'

      # `npm ci` (not `npm install`) so the lockfile is authoritative — otherwise CI can silently
      # resolve different versions than a developer, which defeats the point of testing the diff.
      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm test

  nuxt-app-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nuxt-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'nuxt-app/package-lock.json'

      - name: Install dependencies
        run: npm ci

      # `lint`, not `eslint` — the latter runs with --fix, so it mutates instead of failing and
      # can never gate anything.
      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm test

      # Fails only if the type-error count rises above .typecheck-baseline. See
      # scripts/typecheck-ratchet.mjs for why this is a ratchet and not a hard gate.
      - name: Typecheck (ratchet)
        run: npm run typecheck:ratchet

      # The highest-signal check for a dependency change: does the app still compile and bundle?
      # Route discovery is skipped so the build does not depend on the production CMS.
      - name: Build
        env:
          SKIP_PRERENDER_ROUTE_DISCOVERY: 'true'
        run: npm run build
