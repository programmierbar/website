name: Run tests

on:
  pull_request:
    paths:
      - 'directus-cms/extensions/directus-extension-programmierbar-bundle/**'
      - 'nuxt-app/**'
      - '.github/workflows/run_tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: directus-cms/extensions/directus-extension-programmierbar-bundle
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'directus-cms/extensions/directus-extension-programmierbar-bundle/package-lock.json'

      # Keep `npm ci`, not `npm install`, so the lockfile stays authoritative.
      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm test

  nuxt-app-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nuxt-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'nuxt-app/package-lock.json'

      - name: Install dependencies
        run: npm ci

      # Keep `prettier:check`, not `prettier` — the latter writes, so it would pass by mutating.
      # Without this step formatting is voluntary, which is how 90 files drifted after the Prettier
      # 3.2 -> 3.9 bump in Phase 2 with nothing noticing.
      - name: Check formatting
        run: npm run prettier:check

      # Keep `lint`, not `eslint` — the latter runs with --fix, so it mutates instead of failing.
      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm test

      # Fails only if the error count rises above .typecheck-baseline; see the script for why.
      - name: Typecheck (ratchet)
        run: npm run typecheck:ratchet

      - name: Build
        env:
          SKIP_PRERENDER_ROUTE_DISCOVERY: 'true'
        run: npm run build
